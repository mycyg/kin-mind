[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kin-mind"
version = "0.1.0"
description = "Kin Mind: source-backed memory, affect, desires and personality"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20",
    "tiktoken>=0.9,<1",
    "jieba>=0.42.1",
    "mcp>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.25", "ruff>=0.12", "psutil>=6", "reportlab>=4"]
local-embedding = ["sentence-transformers>=3,<6", "transformers>=4.51,<6"]
vector = ["lancedb>=0.25,<1", "numpy>=2", "pyarrow>=18"]
graph = ["igraph>=0.11,<2"]
media = ["docling>=2.50,<3", "imageio-ffmpeg>=0.6", "pillow>=11"]
all = ["kin-mind[vector,graph,media]"]

[project.scripts]
eventmem = "eventmem.cli:main"
kin-mind = "kin_mind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eventmem", "src/kin_mind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: 需要真实 LLM 端点与 env key 的集成测试，CI 默认跳过",
]
addopts = "-m 'not llm'"

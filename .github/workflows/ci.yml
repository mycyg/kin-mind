name: Kin checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.dev/tiktoken
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra dev --extra vector --extra graph
        working-directory: core
      - run: uv run python scripts/prepare_test_tokenizer.py
        working-directory: core
      - run: uv run python -m pytest -q
        working-directory: core
      - run: node --test core/tests/business/*.test.mjs
      - run: npm ci && npm run typecheck && npm run build
        working-directory: kin
      - run: npm run e2e:all && node dev/check-stop.mjs
        working-directory: kin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-logs
          path: .dev/e2e-all/*.log

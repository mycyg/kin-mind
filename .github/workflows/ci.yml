name: Kin Mind checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_compat:
        description: 'Also check Python 3.11 for release compatibility'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.paths.outputs.core }}
      node: ${{ steps.paths.outputs.node }}
      clients: ${{ steps.paths.outputs.clients }}
      plugin: ${{ steps.paths.outputs.plugin }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUN_ALL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          base = os.environ.get('BASE_REF')
          all_checks = os.environ['RUN_ALL'] == 'true' or not base or not base.strip('0')
          files = [] if all_checks else subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          # The HTTP contract is the Python service's: a change to its routes, models or responses
          # is a change to what the console and the SDKs are promised, so it runs their checks too.
          contract = ('src/eventmem/core/api.py','src/eventmem/core/models.py','src/eventmem/core/responses.py')
          checks = {
            'core': any(p.startswith(('src/','tests/business/','scripts/','contracts/')) or p in ('pyproject.toml','uv.lock') for p in files),
            'node': any(p.startswith('adapters/') or p.startswith('tests/business/') and p.endswith('.mjs') for p in files),
            'clients': any(p.startswith(('console/','sdk/','tests/clients/','contracts/','src/eventmem/sdk/')) or p in contract or p in ('pyproject.toml','scripts/build_frontend.py','scripts/check_wheel.py','scripts/generate_contract.py','scripts/serve_fixture.py','tests/business/test_protocols_v1.py') for p in files),
            # The DeepSeek Harness plugin is a separate public package; nothing Kin deploys uses it.
            'plugin': any(p.startswith('dsh-plugin/') or p == 'tests/clients/plugin.mjs' for p in files),
            'docs': any(p.endswith('.md') or p.startswith('docs/diagrams/') or p == 'scripts/check-docs.mjs' for p in files),
          }
          if any(p.startswith('.github/workflows/') for p in files): all_checks = True
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            for name, changed in checks.items(): print(f'{name}={str(all_checks or changed).lower()}',file=out)
          PY
  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/kin-tiktoken
    strategy:
      matrix:
        python: ${{ fromJSON((inputs.release_compat || startsWith(github.ref, 'refs/tags/')) && '["3.13", "3.11"]' || '["3.13"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev --extra vector --extra graph
      - run: uv run python scripts/prepare_test_tokenizer.py
      - run: uv run python scripts/generate_contract.py --check
      - run: uv run pytest -q tests/business
  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/business/*.test.mjs
  clients:
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    runs-on: ubuntu-latest
    env:
      TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/kin-tiktoken
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra dev --extra vector --extra graph
      - run: uv run python scripts/prepare_test_tokenizer.py
      - run: uv run python scripts/generate_contract.py --check
      - run: npm ci --prefix sdk/typescript && npm run generate --prefix sdk/typescript && git diff --exit-code sdk/typescript/src/schema.ts
      - run: npm run build --prefix sdk/typescript && npm test --prefix sdk/typescript
      # The TypeScript SDK against the running Python service, the case core skips without a build.
      - run: uv run pytest -q tests/business/test_protocols_v1.py -k typescript
      - run: uv build
      - run: uv run python scripts/check_wheel.py
      - run: npx --prefix console playwright install --with-deps chromium
      - run: npm test --prefix console
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-assets
          path: |
            console/test-results
            dist/*
  plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix dsh-plugin && npm run typecheck --prefix dsh-plugin && npm test --prefix dsh-plugin
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-docs.mjs

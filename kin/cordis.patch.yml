# dsh-kin bundle layer.
#  - `kin`: the resident host plugin (mind process, persona, home page routes, browser half).
#  - `preset-kin`: the KIN agent preset. Everything per-session lives in its plugin list, so
#    ordinary coding sessions on other presets are untouched.
#  - `preset-kin-crew`: the preset of work she hands to a team (kin_delegate with `team`).
- insert:
    - id: kin
      name: dsh-kin
    - id: preset-kin
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: kin
        name: KIN
        description: 常驻的陪伴者，也是大家的大总管
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '{{kin_persona}}'
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: kin-preset
            name: dsh-kin/preset
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # Reminders. No job tools: KIN has no shell. No todo: what she has going is kin_work's (and her
          # plans are Core's), and her workers and subagents keep their own lists in the standard preset.
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              # DSH's default keeps 65,536 tokens of headroom beyond a request's own output, which leaves a
              # 32K or 64K model no room to compact at all. Her turns add little at a time (a recall block,
              # pruned tool results), so a smaller margin serves every window her lanes may be given.
              - id: compaction-basic
                name: 'dsh-kin/compaction'
                config:
                  headroomTokens: 16384
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # KIN is the team's chief steward, with two kinds of help. DSH's subagent: a quick helper inside a
          # conversation, on her task lane and the owner's standard coding preset (not hers), whose answer
          # comes back into her turn. Her own kin_delegate / kin_work (src/steward/): the owner's real work,
          # a DSH session in the owner's folder that the owner can open. How far either may go is the owner's
          # 帮手的权限 on her page (src/steward/permission.ts); a subagent inherits it from her conversation.
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  agentPreset: standard
                  agentOptions:
                    provider: kin
                    model: task
    # Her crew's preset, for work she hands to a team (src/steward/work.ts). The worker session in the owner's
    # folder is the team's Lead; the teammates it calls are its children, and DSH gives them this preset, the
    # Lead's model route (her task lane) and its permission. The rows are the standard coding preset's, without
    # what a worker has no use for (plan mode, goals, reminders, questions to the owner, one-shot subagents,
    # plugin management), plus DSH's experimental Agent Teams in a realm of its own: the team service this
    # preset mounts answers only sessions on this preset, and stays apart from the owner's own Agent Teams
    # bundle should that be switched on (work.ts then leaves teams to it and uses the standard preset).
    #
    # Off until it has been tried on a running DSH: the experimental team tools install themselves on every
    # root session that is live when this row activates (a plugin reload with sessions open), her own
    # conversations and the owner's coding sessions included, until those sessions close. Remove `disabled` to
    # turn it on. While it is off, a team is still given when the owner has DSH's own Agent Teams switched on;
    # otherwise the work goes to one worker and she is told so.
    - id: preset-kin-crew
      name: '@deepseek-ai/dsh-agent-preset'
      disabled: true
      config:
        id: kin-crew
        name: KIN 的帮手队
        description: KIN 交出去的大活：一个队长带几个队友，在同一个文件夹里分头做
        order: 9
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              # The same margin as her own preset: this one runs on her lanes too.
              - id: compaction-basic
                name: 'dsh-kin/compaction'
                config:
                  headroomTokens: 16384
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: team
            name: cordis:group
            group: true
            isolate:
              agentTeams: true
            config:
              - id: agent-team
                name: '@deepseek-ai/dsh-experimental-agent-team'
                config:
                  maxMembers: 8
              - id: tool-agent-team
                name: '@deepseek-ai/dsh-experimental-tool-agent-team'
                config:
                  freshProvider: spawn
                  forkProvider: fork
